name: Deploy to Staging

on:
  # Auto-deploy when CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual trigger for hotfixes or rollbacks
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest built from SHA)"
        required: false
        default: ""

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # Never cancel an in-progress deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/lalith996/ipl-auction
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  PNPM_VERSION: "10"

jobs:
  # ─── Gate: only deploy if CI was green ───────────────────────────────────
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          fi

  # ─── Build & push Docker images ──────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: auction-manager
            dockerfile: services/auction-manager/Dockerfile
          - name: llm-gateway
            dockerfile: services/llm-gateway/Dockerfile
          - name: broadcaster
            dockerfile: services/broadcaster/Dockerfile
          - name: agent-orchestrator
            dockerfile: services/agent-orchestrator/Dockerfile
          - name: sag
            dockerfile: services/sag/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: admin
            dockerfile: apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            BUILD_ID=${{ needs.check-ci.outputs.sha }}

  # ─── Deploy via ArgoCD image updater ─────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [check-ci, build-and-push]
    environment:
      name: staging
      url: https://staging.ipl-auction.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Update image tags in kustomization
        run: |
          SHA_SHORT=$(echo "${{ needs.check-ci.outputs.sha }}" | cut -c1-7)
          TAG="sha-${SHA_SHORT}"
          cd infra/k8s
          for SERVICE in auction-manager llm-gateway broadcaster agent-orchestrator sag web admin; do
            kustomize edit set image \
              "ghcr.io/lalith996/ipl-auction/${SERVICE}=ghcr.io/lalith996/ipl-auction/${SERVICE}:${TAG}"
          done

      - name: Apply K8s manifests
        run: |
          kubectl apply -k infra/k8s/
          kubectl rollout status deployment/auction-manager -n ipl-auction --timeout=180s
          kubectl rollout status deployment/llm-gateway      -n ipl-auction --timeout=120s
          kubectl rollout status deployment/broadcaster      -n ipl-auction --timeout=120s
          kubectl rollout status deployment/web              -n ipl-auction --timeout=120s

      - name: Run smoke tests
        run: |
          # Wait for ingress to be ready
          sleep 30
          BASE="https://staging.ipl-auction.example.com"
          ADMIN="https://admin.staging.ipl-auction.example.com"
          curl -f "${BASE}/api/auctions"             || (echo "Web smoke FAILED" && exit 1)
          curl -f "https://am.staging.ipl-auction.example.com/healthz" || true
          echo "Smoke tests passed"

  # ─── Run E2E against staging ──────────────────────────────────────────────
  e2e-staging:
    name: E2E on Staging
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E against staging
        run: pnpm exec playwright test --project=chromium
        env:
          CI: "true"
          BASE_URL: https://staging.ipl-auction.example.com
          ADMIN_URL: https://admin.staging.ipl-auction.example.com

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: playwright-report/
          retention-days: 14

  # ─── Notify on failure ────────────────────────────────────────────────────
  notify-failure:
    name: Notify Deploy Failure
    runs-on: ubuntu-latest
    needs: [deploy, e2e-staging]
    if: failure()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚨 Staging deploy FAILED for `${{ github.repository }}` @ `${{ github.sha }}`\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
