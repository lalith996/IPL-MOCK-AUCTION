name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '10'

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Lint TypeScript
        run: pnpm -r lint

      - name: Lint Python
        run: uv run ruff check services/ packages/ tests/

  # ─── Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Typecheck TypeScript
        run: pnpm -r typecheck

      - name: Typecheck Python
        run: uv run mypy services/sag/src services/agent-orchestrator/src services/ingestion/src --ignore-missing-imports

  # ─── Schema drift ──────────────────────────────────────────────────────────
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Regenerate schemas and check for drift
        run: |
          pnpm --filter @ipl/schemas generate
          git diff --exit-code packages/schemas/ts packages/schemas/py || \
            (echo "Schema drift detected — run 'make schemas' and commit" && exit 1)

  # ─── Unit tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run TypeScript unit tests
        run: pnpm -r test:unit

      - name: Run Python unit tests
        run: uv run pytest tests/unit/ -v

  # ─── Isolation adversarial ─────────────────────────────────────────────────
  test-isolation:
    name: Isolation Adversarial Suite
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run isolation suite
        run: uv run pytest tests/isolation/ -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379

  # ─── Golden auction ────────────────────────────────────────────────────────
  test-golden:
    name: Golden Auction Regression
    runs-on: ubuntu-latest
    needs: [test-unit]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ipl_auction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Run golden auction regression
        run: uv run pytest tests/golden-auction/ -v --tb=short
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ipl_auction_test
          REDIS_URL: redis://localhost:6379

  # ─── E2E (Playwright) ──────────────────────────────────────────────────────
  test-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit]
    # Only run on main or when explicitly triggered — skip on draft PRs
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run E2E tests (mock-only, no live services)
        run: pnpm exec playwright test --project=chromium
        env:
          CI: "true"
          # Tests use page.route() mocks — no real services needed
          BASE_URL: "http://localhost:3000"
          ADMIN_URL: "http://localhost:3001"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Docker build (CI smoke — no push on PRs) ──────────────────────────────
  docker-build:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # Only verify Docker builds on main; skip expensive builds on PRs
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - { name: auction-manager, context: ., dockerfile: services/auction-manager/Dockerfile }
          - { name: llm-gateway,     context: ., dockerfile: services/llm-gateway/Dockerfile }
          - { name: broadcaster,     context: ., dockerfile: services/broadcaster/Dockerfile }
          - { name: web,             context: ., dockerfile: apps/web/Dockerfile }
          - { name: admin,           context: ., dockerfile: apps/admin/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          tags: ghcr.io/lalith996/ipl-auction/${{ matrix.service.name }}:ci
