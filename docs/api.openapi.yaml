openapi: "3.0.0"
info:
  title: IPL 2026 Auction MVP API
  version: "1.0.0"
  description: >
    Production-grade API for IPL 2026 mini-auction with real-time spectator UI,
    agent bidding, and comprehensive observability.
  contact:
    name: IPL Auction Engineering
    url: https://github.com/your-org/ipl-2026-auction
  license:
    name: Proprietary
    url: https://example.com/license

servers:
  - url: http://localhost:3004
    description: Local development
  - url: https://api.auction.ipl2026.example.com
    description: Production

components:
  schemas:
    Auction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique auction identifier
        title:
          type: string
          example: "IPL 2026 Mini Auction"
        phase:
          type: string
          enum: [prep, nominating, opening_bid, open_bidding, closing, sold, unsold]
          description: Current auction phase
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required: [id, phase, createdAt]

    Player:
      type: object
      properties:
        id:
          type: string
          example: "1000851"
        canonicalName:
          type: string
          example: "Virat Kohli"
        role:
          type: string
          enum: [batter, bowler, keeper, allrounder]
        nationality:
          type: string
          example: "IND"
        basePrice:
          type: integer
          description: Base price in crores (1 crore = 10M)
          example: 200
        headshot:
          type: object
          properties:
            primary:
              type: string
              format: uri
            secondary:
              type: string
              format: uri
            blurhash:
              type: string
      required: [id, canonicalName, role, basePrice]

    Bid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auctionId:
          type: string
          format: uuid
        playerId:
          type: string
        teamId:
          type: string
          example: "MI"
        amount:
          type: integer
          description: Bid amount in crores
        biddingAgent:
          type: string
          example: "Agent MI-1"
        rationale:
          type: object
          properties:
            strategy:
              type: string
            scoreBreakdown:
              type: object
        placedAt:
          type: string
          format: date-time
      required: [id, auctionId, playerId, teamId, amount, placedAt]

    AuctionSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        phase:
          type: string
          enum: [prep, nominating, opening_bid, open_bidding, closing, sold, unsold]
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        teams:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              budget:
                type: integer
              spent:
                type: integer
              squad:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        nominatedPlayer:
          $ref: "#/components/schemas/Player"
        bids:
          type: array
          items:
            $ref: "#/components/schemas/Bid"
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, UNAUTHORIZED, RATE_LIMIT, INTERNAL_ERROR]
        details:
          type: object
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          format: uuid
      required: [error, code, timestamp]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    auctionId:
      name: auctionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    playerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string

paths:
  /auctions:
    get:
      summary: List all auction sessions
      operationId: listAuctions
      tags: [Auctions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of auctions
          content:
            application/json:
              schema:
                type: object
                properties:
                  auctions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuctionSession"
                  total:
                    type: integer

    post:
      summary: Create a new auction session
      operationId: createAuction
      security:
        - bearerAuth: []
      tags: [Auctions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                playerPool:
                  type: array
                  items:
                    type: string
                  minItems: 1
                teams:
                  type: array
                  items:
                    type: string
                  minItems: 10
                  maxItems: 10
              required: [title, playerPool, teams]
      responses:
        "201":
          description: Auction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auctions/{auctionId}:
    get:
      summary: Get auction details
      operationId: getAuction
      tags: [Auctions]
      parameters:
        - $ref: "#/components/parameters/auctionId"
      responses:
        "200":
          description: Auction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSession"
        "404":
          description: Auction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auctions/{auctionId}/start:
    post:
      summary: Start an auction session
      operationId: startAuction
      security:
        - bearerAuth: []
      tags: [Auctions]
      parameters:
        - $ref: "#/components/parameters/auctionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                missingPlayersApproved:
                  type: boolean
                  description: Operator has approved missing players report
                headshotsApproved:
                  type: boolean
                  description: Operator has approved headshots report
              required: [missingPlayersApproved, headshotsApproved]
      responses:
        "200":
          description: Auction started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionSession"
        "400":
          description: Invalid state or missing approvals
        "401":
          description: Unauthorized
        "403":
          description: Operator approval required

  /auctions/{auctionId}/pause:
    post:
      summary: Pause an auction session
      operationId: pauseAuction
      security:
        - bearerAuth: []
      tags: [Auctions]
      parameters:
        - $ref: "#/components/parameters/auctionId"
      responses:
        "200":
          description: Auction paused
        "404":
          description: Auction not found

  /auctions/{auctionId}/resume:
    post:
      summary: Resume a paused auction session
      operationId: resumeAuction
      security:
        - bearerAuth: []
      tags: [Auctions]
      parameters:
        - $ref: "#/components/parameters/auctionId"
      responses:
        "200":
          description: Auction resumed
        "404":
          description: Auction not found

  /auctions/{auctionId}/replay:
    get:
      summary: Get full event replay of completed auction
      operationId: getAuctionReplay
      tags: [Auctions]
      parameters:
        - $ref: "#/components/parameters/auctionId"
        - name: from
          in: query
          schema:
            type: integer
            default: 0
            description: Event offset to start from
      responses:
        "200":
          description: Event stream
          content:
            application/x-ndjson:
              schema:
                type: object
                description: Newline-delimited JSON events

  /players/{playerId}:
    get:
      summary: Get player information
      operationId: getPlayer
      tags: [Players]
      parameters:
        - $ref: "#/components/parameters/playerId"
      responses:
        "200":
          description: Player details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found

  /sag/lookup:
    post:
      summary: Search-Analyze-Generate player intelligence
      operationId: sagLookup
      tags: [Intelligence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playerId:
                  type: string
                queryType:
                  type: string
                  enum: [summary, cold_start, form, latest]
              required: [playerId]
      responses:
        "200":
          description: Player intelligence with provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId:
                    type: string
                  summary:
                    type: string
                  metrics:
                    type: object
                  provenance:
                    type: object

  /gateway/health:
    get:
      summary: LLM Gateway health check
      operationId: gatewayHealth
      tags: [Health]
      responses:
        "200":
          description: Gateway healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  models:
                    type: object

  /gateway/usage:
    get:
      summary: Get LLM usage and cost tracking
      operationId: gatewayUsage
      tags: [Observability]
      parameters:
        - name: auctionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Usage metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  callsTotal:
                    type: integer
                  costCents:
                    type: integer
                  budgetCents:
                    type: integer
                  percentUsed:
                    type: number

  /healthz:
    get:
      summary: Kubernetes liveness probe
      operationId: liveness
      tags: [Health]
      responses:
        "200":
          description: Service is alive

  /readyz:
    get:
      summary: Kubernetes readiness probe
      operationId: readiness
      tags: [Health]
      responses:
        "200":
          description: Service is ready for traffic
        "503":
          description: Service not ready

tags:
  - name: Auctions
    description: Auction session management
  - name: Players
    description: Player information
  - name: Intelligence
    description: AI-driven player insights
  - name: Health
    description: Health checks and probes
  - name: Observability
    description: Metrics and monitoring
