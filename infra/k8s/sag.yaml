apiVersion: apps/v1
kind: Deployment
metadata:
  name: sag
  namespace: ipl-auction
  labels:
    app: sag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sag
  template:
    metadata:
      labels:
        app: sag
    spec:
      containers:
        - name: sag
          image: ghcr.io/lalith996/ipl-auction/sag:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: ipl-auction-config
            - secretRef:
                name: ipl-auction-secrets
          env:
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)/0"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sag
  namespace: ipl-auction
spec:
  selector:
    app: sag
  ports:
    - port: 8002
      targetPort: 8002
