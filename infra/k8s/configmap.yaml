apiVersion: v1
kind: ConfigMap
metadata:
  name: ipl-auction-config
  namespace: ipl-auction
data:
  # Service discovery (internal cluster DNS)
  LLM_GATEWAY_URL:     "http://llm-gateway:3002"
  AUCTION_MANAGER_URL: "http://auction-manager:3004"
  ORCHESTRATOR_URL:    "http://agent-orchestrator:8001"
  SAG_URL:             "http://sag:8002"
  BROADCASTER_URL:     "ws://broadcaster:3003"

  # Database (host injected via separate Secret for password)
  DATABASE_HOST:    "postgres"
  DATABASE_PORT:    "5432"
  DATABASE_NAME:    "ipl_auction"
  DATABASE_USER:    "ipl_app"

  # Redis
  REDIS_HOST:       "redis"
  REDIS_PORT:       "6379"

  # OTel collector
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  OTEL_SERVICE_VERSION:        "0.1.0"

  # Rate limits
  LLM_RATE_LIMIT_RPS:  "5"
  SAG_RATE_LIMIT_RPS:  "10"

  # Budget per auction (USD cents)
  LLM_BUDGET_CENTS_PER_AUCTION: "500"

  LOG_LEVEL:    "info"
  NODE_ENV:     "production"
