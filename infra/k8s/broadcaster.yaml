apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: ipl-auction
  labels:
    app: broadcaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: ghcr.io/lalith996/ipl-auction/broadcaster:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: ipl-auction-config
            - secretRef:
                name: ipl-auction-secrets
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)/0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet: { path: /healthz, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 3003 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: broadcaster
  namespace: ipl-auction
  annotations:
    # Enable WebSocket sticky sessions so clients reconnect to same pod
    service.beta.kubernetes.io/aws-load-balancer-stickiness-enabled: "true"
spec:
  selector:
    app: broadcaster
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broadcaster-hpa
  namespace: ipl-auction
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: broadcaster
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
