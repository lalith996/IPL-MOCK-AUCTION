apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-manager
  namespace: ipl-auction
  labels:
    app: auction-manager
    app.kubernetes.io/part-of: ipl-auction
spec:
  replicas: 1   # Singleton per spec — Redis leader election enforces this
  selector:
    matchLabels:
      app: auction-manager
  strategy:
    type: Recreate  # Not RollingUpdate — must not have two instances competing for leader lock
  template:
    metadata:
      labels:
        app: auction-manager
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auction-manager
          image: ghcr.io/lalith996/ipl-auction/auction-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: ipl-auction-config
            - secretRef:
                name: ipl-auction-secrets
          env:
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)/0"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auction-manager
  namespace: ipl-auction
spec:
  selector:
    app: auction-manager
  ports:
    - port: 3004
      targetPort: 3004
