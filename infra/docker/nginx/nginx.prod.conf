################################################################################
# IPL 2026 Auction — Nginx production reverse proxy
# Handles: TLS termination, WebSocket upgrades, rate limiting, compression
################################################################################

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"rt":"$request_time",'
        '"upstream_rt":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Core ─────────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript
                       application/x-ndjson text/xml application/xml image/svg+xml;
    gzip_min_length    1024;

    # ── Security headers (applied to all) ────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m   rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=ws:10m     rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    # ── Upstream blocks ───────────────────────────────────────────────────────
    upstream web_app {
        least_conn;
        server web:3000;
        keepalive 32;
    }

    upstream admin_app {
        server admin:3001;
        keepalive 8;
    }

    upstream broadcaster_ws {
        least_conn;
        server broadcaster:3003;
        keepalive 64;
    }

    upstream auction_manager {
        server auction-manager:3004;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Spectator web app ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ipl-auction.example.com;

        ssl_certificate     /etc/letsencrypt/live/ipl-auction.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ipl-auction.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling        on;
        ssl_stapling_verify on;

        limit_conn perip 50;

        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass         http://web_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout   30s;
        }

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://web_app;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ── Admin console ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.ipl-auction.example.com;

        ssl_certificate     /etc/letsencrypt/live/ipl-auction.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ipl-auction.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Admin: tighter rate limits
        limit_conn perip 10;

        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass         http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── WebSocket broadcaster ──────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ws.ipl-auction.example.com;

        ssl_certificate     /etc/letsencrypt/live/ipl-auction.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ipl-auction.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=ws burst=50 nodelay;
            proxy_pass         http://broadcaster_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;     # Keep WS alive for long auctions
            proxy_send_timeout 3600s;
        }
    }
}
